<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillChain - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #f5576c 75%, #4facfe 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating particles background */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.3; }
            50% { transform: translateY(-20px) rotate(180deg); opacity: 0.8; }
        }

        /* Handshake Animation Container */
        .handshake-container {
            position: relative;
            width: 200px;
            height: 120px;
            margin-bottom: 40px;
            z-index: 10;
            transition: transform 0.3s ease;
        }

        .handshake-container:hover {
            transform: scale(1.05);
        }

        /* Hand SVG Styles */
        .hand {
            position: absolute;
            width: 80px;
            height: 80px;
            transition: all 0.3s ease;
        }

        .hand-left {
            left: 20px;
            animation: handshakeLeft 2s ease-in-out infinite;
        }

        .hand-right {
            right: 20px;
            animation: handshakeRight 2s ease-in-out infinite;
        }

        @keyframes handshakeLeft {
            0%, 100% { transform: translateY(0px) rotate(-5deg); }
            25% { transform: translateY(-5px) rotate(-8deg); }
            50% { transform: translateY(-3px) rotate(-3deg); }
            75% { transform: translateY(-2px) rotate(-6deg); }
        }

        @keyframes handshakeRight {
            0%, 100% { transform: translateY(0px) rotate(5deg); }
            25% { transform: translateY(-5px) rotate(8deg); }
            50% { transform: translateY(-3px) rotate(3deg); }
            75% { transform: translateY(-2px) rotate(6deg); }
        }

        .handshake-container:hover .hand {
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.8));
        }

        /* Login Container */
        .login-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 10;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
            border-radius: 20px;
            z-index: -1;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-title {
            color: white;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .login-subtitle {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1rem;
            font-weight: 300;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .form-input:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .form-input:hover {
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.12);
        }

        .login-button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .login-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .login-button:hover::before {
            left: 100%;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .login-links {
            text-align: center;
            margin-top: 20px;
        }

        .login-link {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 0.9rem;
            margin: 0 10px;
            transition: all 0.3s ease;
            position: relative;
        }

        .login-link:hover {
            color: white;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .login-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1px;
            bottom: -2px;
            left: 50%;
            background: white;
            transition: all 0.3s ease;
        }

        .login-link:hover::after {
            width: 100%;
            left: 0;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .login-container {
                margin: 20px;
                padding: 30px 25px;
            }

            .login-title {
                font-size: 2rem;
            }

            .handshake-container {
                width: 150px;
                height: 90px;
                margin-bottom: 30px;
            }

            .hand {
                width: 60px;
                height: 60px;
            }

            .hand-left {
                left: 15px;
            }

            .hand-right {
                right: 15px;
            }
        }

        @media (max-width: 480px) {
            .login-container {
                margin: 15px;
                padding: 25px 20px;
            }

            .login-title {
                font-size: 1.8rem;
            }

            .handshake-container {
                width: 120px;
                height: 70px;
                margin-bottom: 25px;
            }

            .hand {
                width: 50px;
                height: 50px;
            }

            .hand-left {
                left: 10px;
            }

            .hand-right {
                right: 10px;
            }
        }

        /* Loading Animation */
        .loading {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .login-button.loading {
            color: transparent;
        }

        .login-button.loading .loading {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Floating Particles -->
    <div class="particles" id="particles"></div>

    <!-- Handshake Animation -->
    <div class="handshake-container">
        <svg class="hand hand-left" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="handGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#ffd89b;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#19547b;stop-opacity:1" />
                </linearGradient>
            </defs>
            <!-- Left Hand -->
            <path d="M20 30 Q25 20 35 25 Q45 30 50 40 Q55 50 50 60 Q45 70 35 75 Q25 80 20 70 Q15 60 20 50 Q25 40 30 35 Q25 30 20 30 Z" 
                  fill="url(#handGradient1)" 
                  stroke="rgba(255,255,255,0.3)" 
                  stroke-width="1"/>
            <!-- Fingers -->
            <ellipse cx="30" cy="25" rx="3" ry="8" fill="url(#handGradient1)" transform="rotate(-20 30 25)"/>
            <ellipse cx="35" cy="22" rx="3" ry="8" fill="url(#handGradient1)" transform="rotate(-10 35 22)"/>
            <ellipse cx="40" cy="25" rx="3" ry="8" fill="url(#handGradient1)" transform="rotate(10 40 25)"/>
            <ellipse cx="45" cy="30" rx="3" ry="8" fill="url(#handGradient1)" transform="rotate(20 45 30)"/>
        </svg>

        <svg class="hand hand-right" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="handGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#ffd89b;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#19547b;stop-opacity:1" />
                </linearGradient>
            </defs>
            <!-- Right Hand -->
            <path d="M80 30 Q75 20 65 25 Q55 30 50 40 Q45 50 50 60 Q55 70 65 75 Q75 80 80 70 Q85 60 80 50 Q75 40 70 35 Q75 30 80 30 Z" 
                  fill="url(#handGradient2)" 
                  stroke="rgba(255,255,255,0.3)" 
                  stroke-width="1"/>
            <!-- Fingers -->
            <ellipse cx="70" cy="25" rx="3" ry="8" fill="url(#handGradient2)" transform="rotate(20 70 25)"/>
            <ellipse cx="65" cy="22" rx="3" ry="8" fill="url(#handGradient2)" transform="rotate(10 65 22)"/>
            <ellipse cx="60" cy="25" rx="3" ry="8" fill="url(#handGradient2)" transform="rotate(-10 60 25)"/>
            <ellipse cx="55" cy="30" rx="3" ry="8" fill="url(#handGradient2)" transform="rotate(-20 55 30)"/>
        </svg>
    </div>

    <!-- Login Form -->
    <div class="login-container">
        <div class="login-header">
            <h1 class="login-title">Welcome Back</h1>
            <p class="login-subtitle">Sign in to SkillChain</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <input type="email" class="form-input" placeholder="Email or Username" required>
            </div>
            <div class="form-group">
                <input type="password" class="form-input" placeholder="Password" required>
            </div>
            <button type="submit" class="login-button" id="loginButton">
                <span>Sign In</span>
                <div class="loading"></div>
            </button>
        </form>

        <div class="login-links">
            <a href="#" class="login-link">Forgot Password?</a>
            <a href="#" class="login-link">Create Account</a>
        </div>
    </div>

    <script>
        // Create floating particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 50;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (Math.random() * 3 + 3) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        // Login form handling
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const button = document.getElementById('loginButton');
            button.classList.add('loading');
            
            // Simulate login process
            setTimeout(() => {
                button.classList.remove('loading');
                alert('Login successful! Welcome to SkillChain!');
            }, 2000);
        });

        // Enhanced handshake animation on button hover
        const loginButton = document.getElementById('loginButton');
        const handshakeContainer = document.querySelector('.handshake-container');

        loginButton.addEventListener('mouseenter', function() {
            handshakeContainer.style.transform = 'scale(1.1)';
            handshakeContainer.style.filter = 'drop-shadow(0 0 30px rgba(255, 255, 255, 0.8))';
        });

        loginButton.addEventListener('mouseleave', function() {
            handshakeContainer.style.transform = 'scale(1)';
            handshakeContainer.style.filter = 'none';
        });

        // Input focus effects
        const inputs = document.querySelectorAll('.form-input');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.style.transform = 'translateY(-2px)';
            });
            
            input.addEventListener('blur', function() {
                this.parentElement.style.transform = 'translateY(0)';
            });
        });

        // Page load animation
        window.addEventListener('load', function() {
            document.body.style.opacity = '0';
            document.body.style.transform = 'scale(0.9)';
            
            setTimeout(() => {
                document.body.style.transition = 'all 0.8s ease';
                document.body.style.opacity = '1';
                document.body.style.transform = 'scale(1)';
            }, 100);
        });

        // Initialize particles
        createParticles();

        // Add some interactive effects
        document.addEventListener('mousemove', function(e) {
            const particles = document.querySelectorAll('.particle');
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            particles.forEach((particle, index) => {
                const speed = (index % 3 + 1) * 0.5;
                const xOffset = (x - 0.5) * speed * 20;
                const yOffset = (y - 0.5) * speed * 20;
                
                particle.style.transform = `translate(${xOffset}px, ${yOffset}px)`;
            });
        });

        // Add keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && document.activeElement.classList.contains('form-input')) {
                const inputs = Array.from(document.querySelectorAll('.form-input'));
                const currentIndex = inputs.indexOf(document.activeElement);
                const nextInput = inputs[currentIndex + 1];
                
                if (nextInput) {
                    nextInput.focus();
                } else {
                    document.getElementById('loginButton').click();
                }
            }
        });
    </script>
</body>
</html>
